  <text x="600" y="199" text-anchor="middle" fill="#c1accb" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="4">A PERSONAL COMPANION</text>
  <circle cx="1165" cy="199" r="3" fill="#e5a577"/>
