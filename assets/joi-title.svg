<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Joi — Blade Runner 2049</title>
  <desc id="desc">A cinematic midnight banner with a violet and pink Joi wordmark, thin blue neon lines, and an amber accent.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#090810"/><stop offset=".55" stop-color="#21102c"/><stop offset="1" stop-color="#0b101d"/></linearGradient>
    <linearGradient id="neon"><stop stop-color="#89bdff"/><stop offset=".5" stop-color="#d7aff4"/><stop offset="1" stop-color="#f4a2d3"/></linearGradient>
    <radialGradient id="haze"><stop stop-color="#9a35ba" stop-opacity=".18"/><stop offset="1" stop-color="#9a35ba" stop-opacity="0"/></radialGradient>
  </defs>
  <path fill="url(#night)" d="M0 0h1200v230H0z"/>
  <ellipse cx="600" cy="124" rx="390" ry="145" fill="url(#haze)"/>
  <g fill="none" stroke="url(#neon)" opacity=".24"><path d="M0 28h295m610 0h295M0 203h360m480 0h360"/><path d="M25 17v22m1150-22v22M25 192v22m1150-22v22"/></g>
