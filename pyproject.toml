[project]
name = "joi"
version = "0.1.0"
description = "A tiny character-level transformer trained from scratch on a laptop."
requires-python = ">=3.12,<3.15"
dependencies = ["torch>=2.6,<3", "numpy>=2,<3"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
